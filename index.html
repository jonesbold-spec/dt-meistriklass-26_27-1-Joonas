<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/styles/reset.css" />
    <link rel="stylesheet" href="assets/styles/fonts.css" />
    <link rel="stylesheet" href="assets/styles/variables.css" />
    <link rel="stylesheet" href="assets/styles/typography.css" />
    <link rel="stylesheet" href="assets/styles/style.css" />
    <script src="assets/scripts/utilities.js"></script>
    <script src="assets/scripts/time.js"></script>
    <script src="assets/scripts/script.js"></script>
    <title>Meistriklass</title>
  </head>
  <body>
    <div class="site">
      <pre id="output"></pre>
      <main class="main">
        <!-- Kuupäev -->
        <div class="header">
          <p id="weekday" class="header__unit"></p>
          <p id="day" class="header__unit"></p>
          <p id="month" class="header__unit"></p>
          <p id="year" class="header__unit"></p>
        </div>

        <!-- Kell -->
        <div class="clock">
          <svg id="clock" viewBox="0 0 400 400">
            <circle class="ring" cx="200" cy="200" r="60" />
            <circle class="ring" cx="200" cy="200" r="120" />
            <circle class="ring" cx="200" cy="200" r="180" />

            <polygon id="triangle" />
          </svg>
        </div>
      </main>
    </div>
  </body>
</html>
